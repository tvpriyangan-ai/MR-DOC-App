<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MR DOC - Dashboard</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpeg">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="dashboard-page">
  <header class="app-header">
    <div class="header-left">
      <img src="assets/logo.jpeg" alt="Shop Logo" class="header-logo" onerror="this.style.display='none'">
      <h2>MR DOC</h2>
    </div>
    <nav>
      <a href="invoice.html">Invoice</a>
      <button id="shopValueBtn" class="admin-only">Shop Value</button>
      <button id="usersBtn" class="admin-only">Manage Users</button>
      <button id="customerBtn" class="admin-only">Customer</button>
      <button id="historyBtn" class="admin-only">History</button>
      <span id="userLabel"></span>
      <button id="logoutBtn">Logout</button>
    </nav>
  </header>

  <main class="dashboard-grid">

    <!-- CONTAINER 1: Purchase -->
    <section class="sidebar admin-only accent-gold" id="purchaseSection">
      <h3>
        <span class="card-title-group"><span class="card-icon">&#127991;&#65039;</span> Purchase</span>
        <span class="container-total">0</span>
      </h3>

      <ul id="purchaseList" class="entry-list"></ul>
      <button type="button" class="add-toggle-btn" id="purchaseAddToggle">+ Add Purchase</button>
      <div class="add-form-collapse" id="purchaseFormWrap">
        <form id="purchaseForm" class="entry-form">
          <input type="text" id="purchaseName" placeholder="Name" required>
          <input type="date" id="purchaseDate" required>
          <input type="number" id="purchaseAmount" placeholder="Amount" required>
          <div class="form-actions">
            <button type="submit" class="btn-save">Save</button>
            <button type="button" class="btn-cancel" id="purchaseCancelBtn">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- CONTAINER 2: Loans -->
    <section class="sidebar admin-only accent-rose" id="loanSection">
      <h3>
        <span class="card-title-group"><span class="card-icon">&#129689;</span> Loans</span>
        <span class="container-total">0</span>
      </h3>
      <div class="ledger-row" data-ledger-type="loan" data-ledger-label="Loan"></div>
    </section>

    <!-- CONTAINER 3: CB Bill & Shop Rent -->
    <section class="sidebar admin-only accent-teal" id="cbRentSection">
      <h3>
        <span class="card-title-group"><span class="card-icon">&#129534;</span> CB & Rent</span>
        <span class="container-total">0</span>
      </h3>
      <div class="ledger-row" data-ledger-type="cb_bill" data-ledger-label="CB Bill"></div>
      <div class="ledger-row" data-ledger-type="shop_rent" data-ledger-label="Shop Rent"></div>
    </section>

    <!-- CONTAINER 4: Food & Salary (admin only) -->
    <section class="sidebar admin-only accent-amethyst" id="foodSalarySection">
      <h3>
        <span class="card-title-group"><span class="card-icon">&#128081;</span> Food & Salary</span>
        <span class="container-total">0</span>
      </h3>
      <div class="ledger-row" data-ledger-type="food" data-ledger-label="Food"></div>

      <div class="ledger-row" id="salaryRow">
        <h4>Salary</h4>
        <ul id="salaryList" class="entry-list"></ul>
        <button type="button" class="add-toggle-btn" id="salaryAddToggle">+ Add Salary</button>
        <div class="add-form-collapse" id="salaryFormWrap">
          <form id="salaryForm" class="entry-form">
            <input type="text" id="salaryMemberName" placeholder="Member name" required>
            <input type="date" id="salaryDate" required>
            <input type="number" id="salaryAmount" placeholder="Amount" required>
            <div class="form-actions">
              <button type="submit" class="btn-save">Save</button>
              <button type="button" class="btn-cancel" id="salaryCancelBtn">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- Admin-only modals (hidden by default, shown via JS) -->
  <div id="shopValueModal" class="modal hidden admin-only">
    <div class="modal-box">
      <h3>Shop Total Value</h3>
      <form id="shopValueForm" class="entry-form">
        <input type="text" id="categoryName" placeholder="Category name" required>
        <input type="number" id="categoryCount" placeholder="Count" required>
        <input type="number" id="categoryValue" placeholder="Value per unit" required>
        <button type="submit">Add</button>
      </form>
      <ul id="shopValueList" class="entry-list"></ul>
      <button class="close-modal" data-target="shopValueModal">Close</button>
    </div>
  </div>

  <div id="usersModal" class="modal hidden admin-only">
    <div class="modal-box">
      <h3>Manage Users</h3>
      <form id="userForm" class="entry-form">
        <input type="text" id="userName" placeholder="Full name" required>
        <input type="text" id="userUsername" placeholder="Username" required>
        <input type="text" id="userPassword" placeholder="Password" required>
        <select id="userRole" required>
          <option value="guest">Staff (guest)</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit">Add</button>
      </form>
      <ul id="usersList" class="entry-list"></ul>
      <button class="close-modal" data-target="usersModal">Close</button>
    </div>
  </div>

  <div id="historyModal" class="modal hidden admin-only">
    <div class="modal-box">
      <button class="close-modal modal-close-x" data-target="historyModal" aria-label="Close">&times;</button>
      <h3>Activity History</h3>
      <ul id="historyList" class="entry-list history-list"></ul>
    </div>
  </div>

  <div id="customerModal" class="modal hidden admin-only">
    <div class="modal-box">
      <button class="close-modal modal-close-x" data-target="customerModal" aria-label="Close">&times;</button>
      <h3>Customers</h3>
      <ul id="customerList" class="entry-list"></ul>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/purchase.js"></script>
  <script src="js/ledger.js"></script>
  <script src="js/salary.js"></script>
  <script src="js/shopValue.js"></script>
  <script src="js/users.js"></script>
  <script src="js/history.js"></script>
  <script src="js/customer.js"></script>
</body>
</html>
